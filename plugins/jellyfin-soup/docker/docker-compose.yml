# Local Jellyfin with Soup Auth plugin.
# From plugins/jellyfin-soup:
#   docker compose -f docker/docker-compose.yml up --build
#
# UI: http://localhost:8096
# Point Soup base URL at http://host.docker.internal:8787 (or soup-identity on a shared network).

name: soup-jellyfin

services:
  jellyfin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        JELLYFIN_TAG: "10.11.5"
    image: soup-jellyfin:local
    container_name: soup-jellyfin
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - soup_jellyfin_config:/config
      - soup_jellyfin_cache:/cache
      # Optional: bind local media for library testing
      # - ../../media:/media:ro
    environment:
      # Reach Soup Identity on the host (docker compose in services/soup-identity).
      # Configure in Dashboard → Plugins → Soup Auth → Soup base URL.
      TZ: UTC
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  soup_jellyfin_config:
  soup_jellyfin_cache:
