openapi: 3.0.1
info:
  title: Jellyfin 10.11 Prototype API
  version: 10.11.1
  description: >-
    Prototype subset of the Jellyfin 10.11.1 OpenAPI contract. Endpoint names,
    request bodies, and response fields are derived from Jellyfin's published
    jellyfin-openapi-10.11.1.json snapshot.
servers:
  - url: http://localhost
paths:
  /System/Info/Public:
    get:
      tags: [System]
      operationId: getPublicSystemInfo
      responses:
        '200':
          description: Public server information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSystemInfo'
  /Users/AuthenticateByName:
    post:
      tags: [Authentication]
      operationId: authenticateUserByName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticateUserByName'
      responses:
        '200':
          description: Successful user authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResult'
  /QuickConnect/Enabled:
    get:
      tags: [QuickConnect]
      operationId: getQuickConnectEnabled
      responses:
        '200':
          description: Whether Quick Connect is enabled.
          content:
            application/json:
              schema:
                type: boolean
  /QuickConnect/Initiate:
    post:
      tags: [QuickConnect]
      operationId: initiateQuickConnect
      responses:
        '200':
          description: A new Quick Connect request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickConnectResult'
        '401':
          description: Quick Connect is disabled.
  /QuickConnect/Connect:
    get:
      tags: [QuickConnect]
      operationId: getQuickConnectState
      parameters:
        - name: secret
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The current request state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickConnectResult'
        '401':
          description: Quick Connect is disabled.
        '404':
          description: The request is unknown or expired.
  /Users/AuthenticateWithQuickConnect:
    post:
      tags: [Authentication]
      operationId: authenticateWithQuickConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuickConnectDto'
      responses:
        '200':
          description: Successful user authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResult'
        '400':
          description: The request has not been authorized.
        '401':
          description: Quick Connect is disabled.
        '404':
          description: The request is unknown or expired.
components:
  schemas:
    QuickConnectDto:
      type: object
      required: [Secret]
      properties:
        Secret:
          type: string
    QuickConnectResult:
      type: object
      properties:
        Authenticated:
          type: boolean
        Secret:
          type: string
        Code:
          type: string
        DateAdded:
          type: string
          format: date-time
        DeviceId:
          type: string
        DeviceName:
          type: string
        AppName:
          type: string
        AppVersion:
          type: string
    PublicSystemInfo:
      type: object
      properties:
        ServerName:
          type: string
        Version:
          type: string
        Id:
          type: string
    AuthenticateUserByName:
      type: object
      required: [Username, Pw]
      properties:
        Username:
          type: string
        Pw:
          type: string
          format: password
    AuthenticationResult:
      type: object
      properties:
        User:
          $ref: '#/components/schemas/UserDto'
        AccessToken:
          type: string
        ServerId:
          type: string
    UserDto:
      type: object
      properties:
        Id:
          type: string
        Name:
          type: string
